<!doctype html>
<html lang="{{ or site.Language.Locale site.Language.Lang }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {{ partial "nav.html" . }}
  <main id="main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{- $js := resources.Get "js/nav.js" -}}
  {{- if hugo.IsProduction }}{{ $js = $js | minify | fingerprint }}{{ end -}}
  <script src="{{ $js.RelPermalink }}" defer></script>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
