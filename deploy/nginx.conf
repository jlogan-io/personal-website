# nginx config for jlogan.io -- serves the Hugo build output.
#
# This server is only reachable from inside the Docker network; Traefik
# (Pangolin) terminates TLS and proxies to it. So there is no TLS, no HTTP->HTTPS
# redirect and no port 443 here -- adding them would fight the proxy in front.
#
# Installed at /etc/nginx/conf.d/default.conf, which nginx includes inside its
# http{} block -- hence the map below is legal at this level.

# Cache policy is chosen by response content type rather than by per-location
# add_header directives. This is deliberate: in nginx, an add_header in a
# location block discards ALL add_header directives inherited from the server
# block. Setting cache headers per-location would therefore silently strip the
# security headers below from exactly the responses that need them most.
# One map + one set of add_headers at server level avoids that trap entirely.
map $sent_http_content_type $jlogan_cache_control {
    # HTML and feeds must revalidate, or a deploy stays invisible to returning
    # visitors until their cache happens to expire.
    ~*^text/html                     "no-cache";
    ~*^(application|text)/xml        "no-cache";
    ~*^application/rss               "no-cache";
    ~*^application/json              "no-cache";

    # Hugo does not fingerprint CSS/JS filenames here, so an aggressive max-age
    # would pin visitors to stale styles after a deploy. A week with
    # revalidation keeps repeat visits fast without that risk.
    ~*^text/css                      "public, max-age=604800, must-revalidate";
    ~*^(application|text)/javascript "public, max-age=604800, must-revalidate";

    # Fonts and images are effectively immutable in this site -- a changed
    # image gets a new filename in practice -- so they can be cached hard.
    ~*^font/                         "public, max-age=2592000, immutable";
    ~*^application/font              "public, max-age=2592000, immutable";
    ~*^image/                        "public, max-age=2592000";

    default                          "public, max-age=3600";
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Traefik is the only thing that can reach this container (no published
    # ports), so its forwarded headers are trustworthy. Without this, every
    # access log line records Traefik's container IP instead of the visitor's.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Hugo emits directory-style URLs (/posts/foo/index.html). Keep redirects
    # relative so nginx never leaks its internal http://<container>/ origin into
    # a Location header.
    absolute_redirect off;

    # ---- Headers ----------------------------------------------------------
    # Set once, at server level only. See the map comment above before adding
    # any add_header inside a location block.
    #
    # No CSP: the theme emits inline styles and the contact form posts to
    # Formspree, so a strict policy needs testing against the real pages first.
    add_header Cache-Control $jlogan_cache_control always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Legacy path redirects -------------------------------------------
    # These paths exist in the old build served from homeserveralpha, but a
    # clean rebuild no longer produces them. Without these, every existing
    # inbound link and search-engine result pointing at them 404s.
    #
    #   /Posts/     capital-P directory from an earlier content layout
    #   /refrences/ historical spelling of /references/
    #   /tags/      produced when a post used the plural `tags:` key while the
    #               configured taxonomy is singular `tag` (now fixed in content)
    #
    # Sub-paths are preserved, so /tags/ai/ lands on /tag/ai/ rather than /tag/.
    location ^~ /Posts/ {
        rewrite ^/Posts/(.*)$ /posts/$1 permanent;
    }
    location ^~ /refrences/ {
        rewrite ^/refrences/(.*)$ /references/$1 permanent;
    }
    location ^~ /tags/ {
        rewrite ^/tags/(.*)$ /tag/$1 permanent;
    }

    # ---- Compression ------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/ttf
        font/otf;

    # ---- Routing ----------------------------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # Hugo generates public/404.html; wire it up so misses get the themed page.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Health endpoint for the container healthcheck and for debugging the
    # Pangolin route without loading the whole homepage.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Nothing here is secret, but there is no reason to serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
