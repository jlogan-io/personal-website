# Build configuration only.
#
# Everything the site *says* -- nav labels, contact details, social links, page
# copy -- lives in markdown under content/. Nothing here needs editing to
# publish, rename or reorder anything. See README.md.

baseURL = 'https://jlogan.io'
title = 'Jonathan Logan'
theme = 'slate'
locale = 'en-us'

# Posts are the only section that paginates or feeds RSS from the home page.
[params]
  mainSections = ['writing']

[taxonomies]
  category = 'category'
  series = 'series'
  tag = 'tag'

[markup]
  [markup.goldmark.renderer]
    # Post bodies are authored here, not user-submitted; the render hooks need
    # to emit real markup.
    unsafe = true
  [markup.highlight]
    noClasses = false          # style from syntax.css, not inline
    lineNumbersInTable = false
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[caches]
  [caches.images]
    dir = ':cacheDir/images'
