name: PR preview

on:
  pull_request:
    branches: [main]

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    # Forks cannot read repository secrets, so the deploy would fail with a
    # confusing auth error rather than an informative skip.
    if: github.event.pull_request.head.repo.full_name == github.repository
    env:
      HUGO_VERSION: 0.165.0
      CF_PROJECT: jlogan-io-preview
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Hugo (extended)
        run: |
          curl -sSLo hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i hugo.deb

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        # Drafts and future-dated posts are included so a PR can be reviewed
        # before its publish date. This is the one build where that is wanted.
        run: hugo --gc --minify --buildDrafts --buildFuture

      - name: Keep previews out of search results
        # Written here rather than committed to static/, so it can never reach
        # the production build on GitHub Pages. Cloudflare Pages reads _headers;
        # GitHub Pages ignores it.
        run: |
          printf '/*\n  X-Robots-Tag: noindex\n' > public/_headers

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy public
            --project-name=${{ env.CF_PROJECT }}
            --branch=${{ github.head_ref }}

      - name: Comment the preview URL
        uses: actions/github-script@v7
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.deployment-url }}
        with:
          script: |
            const url = process.env.DEPLOY_URL;
            if (!url) return;
            const marker = '<!-- pr-preview -->';
            const body = `${marker}\nPreview: ${url}\n\nBuilt with \`--buildDrafts --buildFuture\`, so drafts and scheduled posts are visible here and not on the live site.`;
            const {owner, repo} = context.repo;
            const issue_number = context.issue.number;
            const existing = (await github.rest.issues.listComments({owner, repo, issue_number}))
              .data.find(c => c.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({owner, repo, comment_id: existing.id, body});
            } else {
              await github.rest.issues.createComment({owner, repo, issue_number, body});
            }
